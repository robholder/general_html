<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swift_resource_links</title>

    <!-- Dynamically points to your root style.css -->
    <link rel="stylesheet" type="text/css" href="style.css">
    
    <!-- Dynamically points to your root prism.css -->
    <link rel="stylesheet" type="text/css" href="prism/prism.css">
</head>
<body>

    <div class="content">
        


<p>
<a href="https://developer.apple.com/design/human-interface-guidelines/">https://developer.apple.com/design/human-interface-guidelines/</a>
</p>

    </div>

    <!-- Dynamically points to your root prism.js -->
    <script src="prism/prism.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.Prism) {
                document.querySelectorAll("pre").forEach(pre => {
                    // 1. Find the language name from Vimwiki's attributes
                    let lang = pre.getAttributeNames().find(a => !["class", "style", "id"].includes(a)) || "text";
                    
                    // 2. Clear any conflicting class and assign the correct Prism format
                    pre.className = "language-" + lang;
                    
                    // 3. Re-wrap the inner text into a <code> block so Prism can read it
                    if (!pre.querySelector("code")) {
                        const code = document.createElement("code");
                        code.className = "language-" + lang;
                        code.textContent = pre.textContent; // Safe extraction of text
                        pre.innerHTML = "";
                        pre.appendChild(code);
                    }
                });
                
                // 4. Run the highlight pass over the newly formatted blocks
                Prism.highlightAll();
            }
        });
    </script>
</body>
</html>
