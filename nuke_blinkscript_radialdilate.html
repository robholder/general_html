    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.Prism) {
                document.querySelectorAll("pre").forEach(pre => {
                    // 1. Find the language name from Vimwiki's attributes
                    let lang = pre.getAttributeNames().find(a => !["class", "style", "id"].includes(a)) || "text";
                    
                    // 2. Clear any conflicting class and assign the correct Prism format
                    pre.className = "language-" + lang;
                    
                    // 3. Re-wrap the inner text into a <code> block so Prism can read it
                    if (!pre.querySelector("code")) {
                        const code = document.createElement("code");
                        code.className = "language-" + lang;
                        code.textContent = pre.textContent; // Safe extraction of text
                        pre.innerHTML = "";
                        pre.appendChild(code);
                    }
                });
                
                // 4. Run the highlight pass over the newly formatted blocks
                Prism.highlightAll();
            }
        });
    </script>
